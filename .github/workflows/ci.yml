name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Schema Contract Tests
        run: pnpm --filter @lowcode-platform/schema-contract test

      - name: Frontend Vitest Suite
        run: pnpm --filter @lowcode-platform/frontend test run

      - name: Backend Tests
        run: |
          CI=true ./packages/backend/node_modules/.bin/jest -c packages/backend/jest.config.js --runInBand --testPathIgnorePatterns="ai.controller.e2e-spec.ts|ai.controller.spec.ts|ai-provider.factory.spec.ts"

      - name: Compiler Template Regression
        run: node packages/backend/scripts/compiler-template-regression.cjs
