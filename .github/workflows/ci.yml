name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Schema Contract
        run: pnpm --filter @lowcode-platform/schema-contract build

      # 真实消费链路冒烟：通过 exports map 自引用解析，验证 CJS require / ESM import / 类型声明
      - name: Schema Contract consumption smoke test
        run: |
          test -f packages/schema-contract/dist/index.js
          test -f packages/schema-contract/dist/index.d.ts
          cd packages/schema-contract
          node -e "const c = require('@lowcode-platform/schema-contract'); if (typeof c.createCanonicalPageSchema !== 'function' || typeof c.validatePageSchemaValue !== 'function' || typeof c.requireSupportedPageSchema !== 'function') { throw new Error('CJS consumption via exports map failed'); }"
          node --input-type=module -e "const m = await import('@lowcode-platform/schema-contract'); if (typeof m.createCanonicalPageSchema !== 'function' || typeof m.requireSupportedPageSchema !== 'function') { throw new Error('ESM consumption via exports map failed'); }"

      - name: Type Check
        run: pnpm type-check

      - name: Schema Contract Tests
        run: pnpm --filter @lowcode-platform/schema-contract test

      - name: Frontend Vitest Suite
        run: pnpm --filter @lowcode-platform/frontend test run

      - name: Backend Tests
        run: |
          CI=true ./packages/backend/node_modules/.bin/jest -c packages/backend/jest.config.js --runInBand --testPathIgnorePatterns="ai.controller.e2e-spec.ts|ai.controller.spec.ts|ai-provider.factory.spec.ts"

      - name: Compiler Template Regression
        run: node packages/backend/scripts/compiler-template-regression.cjs
