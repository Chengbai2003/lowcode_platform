name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Schema Contract
        run: pnpm --filter @lowcode-platform/schema-contract build

      # 真实消费链路冒烟：通过 exports map 自引用解析，验证 CJS require / ESM import / 类型声明
      - name: Schema Contract consumption smoke test
        run: |
          test -f packages/schema-contract/dist/index.js
          test -f packages/schema-contract/dist/index.d.ts
          cd packages/schema-contract
          node -e "const c = require('@lowcode-platform/schema-contract'); if (typeof c.createCanonicalPageSchema !== 'function' || typeof c.validatePageSchemaValue !== 'function' || typeof c.requireSupportedPageSchema !== 'function') { throw new Error('CJS consumption via exports map failed'); }"
          node --input-type=module -e "const m = await import('@lowcode-platform/schema-contract'); if (typeof m.createCanonicalPageSchema !== 'function' || typeof m.requireSupportedPageSchema !== 'function') { throw new Error('ESM consumption via exports map failed'); }"

      # Issue #19 / M0-4 Scope A：Renderer 独立包构建与消费冒烟
      - name: Build Renderer Package
        run: pnpm --filter @lowcode-platform/renderer build

      - name: Renderer Package consumption smoke test
        run: |
          test -f packages/renderer/dist/index.js
          test -f packages/renderer/dist/index.d.ts
          test -f packages/renderer/dist/host/createRendererHost.js
          test -f packages/renderer/dist/dsl/index.d.ts
          cd packages/renderer
          node -e "const r = require('@lowcode-platform/renderer'); const h = require('@lowcode-platform/renderer/host'); if (typeof r.PageRenderer !== 'function' || typeof r.Renderer !== 'function' || typeof r.renderFromJSON !== 'function' || typeof r.createSealedPreset !== 'function' || typeof h.createRendererHost !== 'function') { throw new Error('CJS consumption via exports map failed'); }"
          node --input-type=module -e "const r = await import('@lowcode-platform/renderer'); if (typeof r.PageRenderer !== 'function' || typeof r.renderFromJSON !== 'function') { throw new Error('ESM consumption via exports map failed'); }"

      # Issue #19 / M0-4 Scope B：AntD Preset 包构建与消费冒烟
      - name: Build Preset Antd Package
        run: pnpm --filter @lowcode-platform/preset-antd build

      - name: Preset Antd Package consumption smoke test
        run: |
          test -f packages/preset-antd/dist/index.js
          test -f packages/preset-antd/dist/runtime.js
          test -f packages/preset-antd/dist/manifest.js
          test -f packages/preset-antd/dist/validation.js
          test -f packages/preset-antd/dist/compiler.js
          cd packages/preset-antd
          node -e "const p = require('@lowcode-platform/preset-antd'); const r = require('@lowcode-platform/preset-antd/runtime'); const m = require('@lowcode-platform/preset-antd/manifest'); const c = require('@lowcode-platform/preset-antd/compiler'); if (typeof p.createAntdPreset !== 'function' || !Object.isFrozen(p.antdPreset) || !r.antdRuntime.Page || !m.antdManifest.Div || !c.antdCompilerBindings.componentSources.Text) { throw new Error('CJS consumption via exports map failed'); }"
          node --input-type=module -e "const p = await import('@lowcode-platform/preset-antd'); if (typeof p.createAntdPreset !== 'function' || !Object.isFrozen(p.antdPreset)) { throw new Error('ESM consumption via exports map failed'); }"

      # 前端 vite build：守护 workspace 包 dist 的 CJS 命名导出可被 rollup 静态解析
      # （renderer 的 dist 已成为前端运行时依赖，vite build 不在 CI 会漏掉这一类回归）
      - name: Build Packages
        run: pnpm build:packages

      - name: Type Check
        run: pnpm type-check

      - name: Architecture Boundaries Check
        run: pnpm check:architecture

      - name: Lint
        run: pnpm lint --max-warnings 500

      - name: Format Check
        run: pnpm format:check

      - name: Schema Contract Tests
        run: pnpm --filter @lowcode-platform/schema-contract test

      - name: Renderer Package Tests
        run: pnpm test:renderer

      - name: Preset Antd Package Tests
        run: pnpm test:preset-antd

      - name: Frontend Tests
        run: pnpm test:frontend

      - name: Backend Tests
        run: pnpm test:backend

      - name: Compiler Template Regression
        run: pnpm --filter @lowcode-platform/backend compiler:regression

      # Issue #18 / M0-3：确定性安全回归门禁（无网络、无模型凭据）
      - name: Agent Deterministic Eval
        run: pnpm eval:deterministic
